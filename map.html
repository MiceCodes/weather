<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="style.css">
    
    <style>
        #weather-map { height: 500px; width: 100%; border-radius: 8px; margin-top: 20px; z-index: 1; }
    </style>
</head>
<body>

    <header class="navbar-container">
        <h1>Map</h1>
        <div class="search-group">
            <input type="search" placeholder="Enter city name">
            <button type="submit">Search</button>

            <select id="navigation-dropdown">
                <option value="" disabled selected>Jump to page</option>
                <option value="home.html">Home</option>
                <option value="weather_warnings.html">Weather Warnings</option>
                <option value="year_module.html">Year Module</option>
                <option value="settings.html">Settings</option>
            </select>
        </div>
    </header>

    <main class="map-container">
        <h2>Interactive Weather Map</h2>
        <p>Click anywhere on the map to see the current weather!</p>
        
        <div id="weather-map" class="map-display"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="script.js"></script>
</body>
</html>
