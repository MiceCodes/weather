<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar-container">
        <h1>Settings</h1>
            <select id="navigation-dropdown">
                <option value="" disabled selected>Jump to page</option>
                <option value="home.html">Home</option>
                <option value="weather_warnings.html">Weather Warnings</option>
                <option value="year_module.html">Year Module</option>
                <option value="map.html">Map</option>
            </select>
        </div>
    </header>

    <main class="settings-container">
        <h2>App Preferences</h2>
        
        <section class="setting-group">
            <h3>Temperature Unit</h3>
            <div class="toggle-options">
                <input type="radio" id="celsius" name="temp-unit" value="metric" checked>
                <label for="celsius">Celsius (°C)</label>
                
                <input type="radio" id="fahrenheit" name="temp-unit" value="imperial">
                <label for="fahrenheit">Fahrenheit (°F)</label>
            </div>
        </section>

        <section class="setting-group">
            <h3>Display Theme</h3>
            <div class="toggle-options">
                <input type="radio" id="light" name="theme" value="light" checked>
                <label for="light">Light Mode</label>
                
                <input type="radio" id="dark" name="theme" value="dark">
                <label for="dark">Dark Mode</label>
            </div>
        </section>

    </main>

    <script src="script.js"></script>
</body>
</html>
