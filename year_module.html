<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Year Module</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar-container">
        <h1>Year Module</h1>
        <div class="search-group">
            <input type="search" placeholder="Enter city name">
            <button type="submit">Search</button>

            <select id="navigation-dropdown">
                <option value="" disabled selected>Jump to page</option>
                <option value="home.html">Home</option>
                <option value="weather_warnings.html">Weather Warnings</option>
                <option value="map.html">Map</option>
                <option value="settings.html">Settings</option>
            </select>
        </div>
    </header>

    <main class="year-container">
        <h2>Annual Climate Data</h2>
        
        <div class="year-controls">
            <label for="year-select">Select Year:</label>
            <select id="year-select">
                <option value="2026" selected>2026</option>
                <option value="2025">2025</option>
                <option value="2024">2024</option>
            </select>
        </div>

        <div id="yearly-data-display" class="data-display">
            <p>Select a year to view monthly averages...</p>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
